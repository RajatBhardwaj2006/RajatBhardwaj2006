<svg xmlns="http://www.w3.org/2000/svg" width="560" height="780" viewBox="0 0 560 780" role="img" aria-labelledby="title desc">
<title id="title">Total commits and active days committed</title><desc id="desc">1,382 contributions across 235 active days. Longest streak: 203 days. Consistency: 64.4%.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-kerning:normal} .still{display:none}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-180}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-rev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes tumble{0%{transform:rotate(0deg) scale(1,1)}25%{transform:rotate(90deg) scale(0.32,1)}50%{transform:rotate(180deg) scale(-1,0.5)}75%{transform:rotate(270deg) scale(0.32,-1)}100%{transform:rotate(360deg) scale(1,1)}}
@keyframes scan-vert{0%,100%{transform:translateY(-42px);opacity:.35}50%{transform:translateY(42px);opacity:1}}
@keyframes radar{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.float{animation:drift 9s ease-in-out infinite}.flow{animation:sweep 14s linear infinite}.pulse{animation:breathe 6s ease-in-out infinite}
.spin{transform-origin:480px 175px;animation:spin 18s linear infinite}
.spin-rev{transform-origin:480px 175px;animation:spin-rev 14s linear infinite}
.tumble{transform-origin:480px 175px;animation:tumble 8s ease-in-out infinite}
.scan{transform-origin:480px 175px;animation:scan-vert 3.2s ease-in-out infinite}
.radar{transform-origin:480px 175px;animation:radar 4s linear infinite}
@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}.float,.flow,.pulse,.spin,.spin-rev,.tumble,.scan,.radar{animation:none}}
</style>
<rect width="560" height="780" rx="4" fill="#111411"/>
<text x="30" y="50" font-size="28" font-weight="600" fill="#f3f6ef">Commit history &amp; activity.</text>
<circle cx="280" cy="250" r="100" fill="none" stroke="#232a21" stroke-width="24"/>
<circle cx="280" cy="250" r="100" fill="none" stroke="#c5f277" stroke-width="24" stroke-dasharray="404.53 628.32" stroke-linecap="round" transform="rotate(-90 280 250)"/>
<text x="280" y="242" text-anchor="middle" font-size="56" font-weight="700" letter-spacing="-2" fill="#f3f6ef">235</text>
<text x="280" y="274" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#a4afa1">days committed</text>
<text x="280" y="300" text-anchor="middle" font-size="15" fill="#c5f277">64.4% of year</text>

<rect x="30" y="415" width="500" height="66" rx="6" fill="#161b16"/>
<text x="50" y="442" font-size="14" fill="#a4afa1">Total contributions</text>
<text x="50" y="468" font-size="22" font-weight="700" fill="#c5f277">1,382</text>

<rect x="30" y="495" width="500" height="66" rx="6" fill="#161b16"/>
<text x="50" y="522" font-size="14" fill="#a4afa1">Active days committed</text>
<text x="50" y="548" font-size="22" font-weight="700" fill="#f3f6ef">235 <tspan font-size="15" font-weight="400" fill="#a4afa1">/ 365 days</tspan></text>

<rect x="30" y="575" width="500" height="66" rx="6" fill="#161b16"/>
<text x="50" y="602" font-size="14" fill="#a4afa1">Longest streak</text>
<text x="50" y="628" font-size="22" font-weight="700" fill="#f3f6ef">203 <tspan font-size="15" font-weight="400" fill="#a4afa1">days</tspan></text>

<rect x="30" y="655" width="500" height="66" rx="6" fill="#161b16"/>
<text x="50" y="682" font-size="14" fill="#a4afa1">Busiest day</text>
<text x="50" y="708" font-size="22" font-weight="700" fill="#c5f277">43 <tspan font-size="15" font-weight="400" fill="#a4afa1">contributions</tspan></text>

<text x="30" y="755" font-size="15" fill="#a4afa1">365-day tracking, GitHub contribution calendar</text>
</svg>
