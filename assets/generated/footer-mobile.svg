<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" role="img" aria-labelledby="title desc">
<title id="title">Explore the work on GitHub</title><desc id="desc">Visit https://github.com/RajatBhardwaj2006</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-kerning:normal} .still{display:none}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-180}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:drift 9s ease-in-out infinite}.flow{animation:sweep 14s linear infinite}.pulse{animation:breathe 6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}.float,.flow,.pulse{animation:none}}
</style>
<rect width="560" height="160" rx="4" fill="#111411"/>
<text x="30" y="66" font-size="32" font-weight="600" fill="#f3f6ef">Keep exploring.</text><text x="30" y="112" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#c5f277">github.com/RajatBhardwaj2006</text><path d="M468 91l40 -40m-40 0h40v40" fill="none" stroke="#c5f277" stroke-width="2"/>
</svg>
