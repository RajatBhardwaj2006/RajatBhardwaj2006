<svg xmlns="http://www.w3.org/2000/svg" width="580" height="462" viewBox="0 0 580 462" role="img" aria-labelledby="title desc">
<title id="title">Languages across the codebase</title><desc id="desc">Primary language distribution by repository count, excluding forks and repositories with no detected language. Python 26.3%, C++ 15.8%, Jupyter Notebook 15.8%, Java 10.5%, JavaScript 10.5%.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-kerning:normal} .still{display:none}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-180}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-rev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes tumble{0%{transform:rotate(0deg) scale(1,1)}25%{transform:rotate(90deg) scale(0.32,1)}50%{transform:rotate(180deg) scale(-1,0.5)}75%{transform:rotate(270deg) scale(0.32,-1)}100%{transform:rotate(360deg) scale(1,1)}}
@keyframes scan-vert{0%,100%{transform:translateY(-42px);opacity:.35}50%{transform:translateY(42px);opacity:1}}
@keyframes radar{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.float{animation:drift 9s ease-in-out infinite}.flow{animation:sweep 14s linear infinite}.pulse{animation:breathe 6s ease-in-out infinite}
.spin{transform-origin:480px 175px;animation:spin 18s linear infinite}
.spin-rev{transform-origin:480px 175px;animation:spin-rev 14s linear infinite}
.tumble{transform-origin:480px 175px;animation:tumble 8s ease-in-out infinite}
.scan{transform-origin:480px 175px;animation:scan-vert 3.2s ease-in-out infinite}
.radar{transform-origin:480px 175px;animation:radar 4s linear infinite}
@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}.float,.flow,.pulse,.spin,.spin-rev,.tumble,.scan,.radar{animation:none}}
</style>
<rect width="580" height="462" rx="4" fill="#111411"/>
<text x="36" y="54" font-size="26" font-weight="600" fill="#f3f6ef">Across the codebase.</text>
<path d="M151.55 144.01 A86 86 0 0 1 235.82 235.56" fill="none" stroke="#c5f277" stroke-width="22"><title>Python 26.3%</title></path><path d="M235.56 238.64 A86 86 0 0 1 192.29 304.89" fill="none" stroke="#95b85c" stroke-width="22"><title>C++ 15.8%</title></path><path d="M189.56 306.36 A86 86 0 0 1 110.44 306.36" fill="none" stroke="#748e4a" stroke-width="22"><title>Jupyter Notebook 15.8%</title></path><path d="M107.71 304.89 A86 86 0 0 1 71.88 265.96" fill="none" stroke="#526a38" stroke-width="22"><title>Java 10.5%</title></path><path d="M70.63 263.12 A86 86 0 0 1 66.27 210.39" fill="none" stroke="#394c2a" stroke-width="22"><title>JavaScript 10.5%</title></path><path d="M67.03 207.39 A86 86 0 0 1 148.45 144.01" fill="none" stroke="#283522" stroke-width="22"><title>Other 21.1%</title></path><text x="150" y="224" text-anchor="middle" font-size="48" font-weight="700" letter-spacing="-2" fill="#f3f6ef">9</text>
<text x="150" y="252" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" fill="#a4afa1">languages</text>
<rect x="300" y="96" width="7" height="16" rx="2" fill="#c5f277"/><text x="320" y="110" font-size="18" fill="#f3f6ef">Python</text><text x="546" y="110" text-anchor="end" font-size="18" fill="#c5f277">26.3%</text><rect x="300" y="138" width="7" height="16" rx="2" fill="#95b85c"/><text x="320" y="152" font-size="18" fill="#f3f6ef">C++</text><text x="546" y="152" text-anchor="end" font-size="18" fill="#a4afa1">15.8%</text><rect x="300" y="180" width="7" height="16" rx="2" fill="#748e4a"/><text x="320" y="194" font-size="18" fill="#f3f6ef">Jupyter Notebook</text><text x="546" y="194" text-anchor="end" font-size="18" fill="#a4afa1">15.8%</text><rect x="300" y="222" width="7" height="16" rx="2" fill="#526a38"/><text x="320" y="236" font-size="18" fill="#f3f6ef">Java</text><text x="546" y="236" text-anchor="end" font-size="18" fill="#a4afa1">10.5%</text><rect x="300" y="264" width="7" height="16" rx="2" fill="#394c2a"/><text x="320" y="278" font-size="18" fill="#f3f6ef">JavaScript</text><text x="546" y="278" text-anchor="end" font-size="18" fill="#a4afa1">10.5%</text><rect x="300" y="306" width="7" height="16" rx="2" fill="#283522"/><text x="320" y="320" font-size="18" fill="#f3f6ef">Other</text><text x="546" y="320" text-anchor="end" font-size="18" fill="#a4afa1">21.1%</text>
<text x="36" y="422" font-size="14" fill="#a4afa1">19 repositories, primary language per repo</text>
</svg>
