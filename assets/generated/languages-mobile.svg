<svg xmlns="http://www.w3.org/2000/svg" width="560" height="780" viewBox="0 0 560 780" role="img" aria-labelledby="title desc">
<title id="title">Languages across the codebase</title><desc id="desc">Primary language distribution by repository count. C++ 18.8%, Jupyter Notebook 18.8%, Java 12.5%, JavaScript 12.5%, Python 12.5%.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-kerning:normal} .still{display:none}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-180}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-rev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes tumble{0%{transform:rotate(0deg) scale(1,1)}25%{transform:rotate(90deg) scale(0.32,1)}50%{transform:rotate(180deg) scale(-1,0.5)}75%{transform:rotate(270deg) scale(0.32,-1)}100%{transform:rotate(360deg) scale(1,1)}}
@keyframes scan-vert{0%,100%{transform:translateY(-42px);opacity:.35}50%{transform:translateY(42px);opacity:1}}
@keyframes radar{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.float{animation:drift 9s ease-in-out infinite}.flow{animation:sweep 14s linear infinite}.pulse{animation:breathe 6s ease-in-out infinite}
.spin{transform-origin:480px 175px;animation:spin 18s linear infinite}
.spin-rev{transform-origin:480px 175px;animation:spin-rev 14s linear infinite}
.tumble{transform-origin:480px 175px;animation:tumble 8s ease-in-out infinite}
.scan{transform-origin:480px 175px;animation:scan-vert 3.2s ease-in-out infinite}
.radar{transform-origin:480px 175px;animation:radar 4s linear infinite}
@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}.float,.flow,.pulse,.spin,.spin-rev,.tumble,.scan,.radar{animation:none}}
</style>
<rect width="560" height="780" rx="4" fill="#111411"/>
<text x="30" y="50" font-size="28" font-weight="600" fill="#f3f6ef">Across the codebase.</text>
<path d="M281.8 150.02 A100 100 0 0 1 371.68 210.07" fill="none" stroke="#c5f277" stroke-width="26"><title>C++ 18.8%</title></path><path d="M373.06 213.4 A100 100 0 0 1 351.97 319.43" fill="none" stroke="#95b85c" stroke-width="26"><title>Jupyter Notebook 18.8%</title></path><path d="M349.43 321.97 A100 100 0 0 1 281.8 349.98" fill="none" stroke="#748e4a" stroke-width="26"><title>Java 12.5%</title></path><path d="M278.2 349.98 A100 100 0 0 1 210.57 321.97" fill="none" stroke="#526a38" stroke-width="26"><title>JavaScript 12.5%</title></path><path d="M208.03 319.43 A100 100 0 0 1 180.02 251.8" fill="none" stroke="#394c2a" stroke-width="26"><title>Python 12.5%</title></path><path d="M180.02 248.2 A100 100 0 0 1 278.2 150.02" fill="none" stroke="#283522" stroke-width="26"><title>Other 25.0%</title></path><text x="280" y="245" text-anchor="middle" font-size="60" font-weight="600" fill="#f3f6ef">9</text>
<text x="280" y="280" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#a4afa1">languages</text>
<text x="60" y="440" font-size="20" fill="#f3f6ef">C++</text><text x="510" y="440" text-anchor="end" font-size="20" fill="#c5f277">18.8%</text><rect x="30" y="425" width="8" height="18" fill="#c5f277"/><text x="60" y="484" font-size="20" fill="#f3f6ef">Jupyter Notebook</text><text x="510" y="484" text-anchor="end" font-size="20" fill="#a4afa1">18.8%</text><rect x="30" y="469" width="8" height="18" fill="#95b85c"/><text x="60" y="528" font-size="20" fill="#f3f6ef">Java</text><text x="510" y="528" text-anchor="end" font-size="20" fill="#a4afa1">12.5%</text><rect x="30" y="513" width="8" height="18" fill="#748e4a"/><text x="60" y="572" font-size="20" fill="#f3f6ef">JavaScript</text><text x="510" y="572" text-anchor="end" font-size="20" fill="#a4afa1">12.5%</text><rect x="30" y="557" width="8" height="18" fill="#526a38"/><text x="60" y="616" font-size="20" fill="#f3f6ef">Python</text><text x="510" y="616" text-anchor="end" font-size="20" fill="#a4afa1">12.5%</text><rect x="30" y="601" width="8" height="18" fill="#394c2a"/><text x="60" y="660" font-size="20" fill="#f3f6ef">Other</text><text x="510" y="660" text-anchor="end" font-size="20" fill="#a4afa1">25.0%</text><rect x="30" y="645" width="8" height="18" fill="#283522"/>
<text x="30" y="744" font-size="16" fill="#a4afa1">16 repositories, one primary language per repo</text>
</svg>
