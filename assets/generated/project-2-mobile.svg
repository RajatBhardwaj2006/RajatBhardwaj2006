        <line x1="451" y1="175" x2="465" y2="175" stroke="#c5f277" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="496" cy="170" r="2.8" fill="#c5f277"/>
        <circle cx="504" cy="177" r="2.4" fill="#c5f277"/>
        <circle cx="494" cy="182" r="2.2" fill="#c5f277"/>
