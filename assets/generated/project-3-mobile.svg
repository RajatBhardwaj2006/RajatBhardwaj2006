<title id="title">VisionInspect-Industrial-Defect-Detection-</title><desc id="desc">Build an unsupervised visual anomaly-detection pipeline using a Convolutional Autoencoder and/or PatchCore-style feature-based anomaly detection. The system should learn primarily from defect-free images and generate an anomaly score, normal/abnormal decision, and visual anomaly heatmap for test images.. Jupyter Notebook. 1 stars. Last pushed 22 Oct 2026.</desc>
