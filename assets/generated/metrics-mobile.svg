<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
<title id="title">Profile snapshot metrics</title><desc id="desc">16 public repositories, 1,161 contributions in the past year, 8 followers, 4 stars earned across repositories</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-kerning:normal} .still{display:none}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-180}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:drift 9s ease-in-out infinite}.flow{animation:sweep 14s linear infinite}.pulse{animation:breathe 6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}.float,.flow,.pulse{animation:none}}
</style>
<rect width="560" height="420" rx="4" fill="#111411"/>

<rect x="30" y="30" width="500" height="78" rx="6" fill="#161b16"/>
<text x="50" y="78" font-size="36" font-weight="700" letter-spacing="-1" fill="#f3f6ef">16</text>
<text x="210" y="78" font-size="17" fill="#a4afa1">public repositories</text>
<rect x="30" y="124" width="500" height="78" rx="6" fill="#161b16"/>
<text x="50" y="172" font-size="36" font-weight="700" letter-spacing="-1" fill="#f3f6ef">1,161</text>
<text x="210" y="172" font-size="17" fill="#a4afa1">contributions in the past year</text>
<rect x="30" y="218" width="500" height="78" rx="6" fill="#161b16"/>
<text x="50" y="266" font-size="36" font-weight="700" letter-spacing="-1" fill="#f3f6ef">8</text>
<text x="210" y="266" font-size="17" fill="#a4afa1">followers</text>
<rect x="30" y="312" width="500" height="78" rx="6" fill="#161b16"/>
<text x="50" y="360" font-size="36" font-weight="700" letter-spacing="-1" fill="#f3f6ef">4</text>
<text x="210" y="360" font-size="17" fill="#a4afa1">stars earned across repositories</text>
</svg>
