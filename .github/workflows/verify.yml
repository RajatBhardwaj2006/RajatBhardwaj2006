name: Verify profile

on:
  pull_request:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'profile.config.json'
      - 'data/**'
      - 'assets/**'
      - 'README.md'
      - 'package.json'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
      - name: Confirm every generated file is reproducible
        run: |
          npm run build
          git diff --exit-code -- README.md assets/generated
